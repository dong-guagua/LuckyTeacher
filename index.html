<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
:root{
  --bg:#1f1a33; --panel:#2b2547; --tile:#f8f1f4; --ink:#2a2140;
  --p1:#4d8dff; --p2:#ffb82e; --rose:#ff6b8b; --purple:#6b3fa0;
  --s:clamp(28px, calc((100vw - 12px) / 13), 58px);
  --h:calc(var(--s) * .86);
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:#f4eefc;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{min-height:100vh;overflow-x:auto;display:flex;flex-direction:column;align-items:center;padding:12px 6px 40px}
h1{font-size:20px;letter-spacing:.12em;margin:4px 0 10px}

/* ---------- 棋盘 ---------- */
#board{display:grid;grid-template-columns:repeat(13,var(--s));grid-template-rows:repeat(13,var(--h));position:relative}
.cell{
  background:var(--tile);color:var(--ink);box-shadow:inset 0 0 0 1px #2a2140;
  display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;
  font-size:clamp(6px,calc(var(--s)*.2),10.5px);line-height:1.1;padding:1px;position:relative;overflow:hidden;word-break:break-all;
}
.cell.c0,.cell.s0{background:#8cc3f5}
.cell.c1,.cell.s1{background:#ffd361}
.cell.red,.cell.home{color:#c4001f;font-weight:700}
.cell.cur{box-shadow:inset 0 0 0 3px var(--rose)}
.zone{
  margin:5px;border-radius:16px;border:2px dashed;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;gap:6px
}
#h0{grid-area:1/1/4/4;border-color:var(--p1);color:var(--p1)}
#h1{grid-area:11/11/14/14;border-color:var(--p2);color:var(--p2)}
.zone .pieces{position:static;inset:auto}
.zone .piece{width:calc(var(--s)*.9);height:calc(var(--s)*.9);font-size:calc(var(--s)*.55)}
#finish{
  position:absolute;left:calc(var(--s)*5.75);top:calc(var(--h)*6.5 - var(--s)*.75);
  width:calc(var(--s)*1.5);height:calc(var(--s)*1.5);border-radius:50%;background:var(--purple);z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:clamp(9px,calc(var(--s)*.3),15px);font-weight:700;color:#fff
}
#finish .pieces{position:static;inset:auto}
#title{grid-area:2/5/4/10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
#title strong{font-size:clamp(14px,calc(var(--s)*.5),28px);color:var(--rose);letter-spacing:.08em}
#title span{font-size:clamp(8px,calc(var(--s)*.22),12px);opacity:.7}
.deco{display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.9);opacity:.2;gap:calc(var(--s)*.5)}
#d1{grid-area:4/5/5/10;color:var(--p2)}
#d2{grid-area:10/5/11/10;color:var(--p1)}
.pieces{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;pointer-events:none;z-index:3}
.piece{
  width:calc(var(--s)*.46);height:calc(var(--s)*.46);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.3);font-weight:700;color:#fff;
  border:2px solid #fff;box-shadow:0 2px 6px #0006
}
.piece.p0{background:var(--p1)} .piece.p1{background:var(--p2)}

/* ---------- 控制面板 ---------- */
#panel{
  width:calc(var(--s)*13);max-width:680px;margin-top:14px;background:var(--panel);
  border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px
}
.players{display:flex;gap:8px}
.pl{flex:1;border-radius:12px;padding:8px 10px;border:2px solid transparent;background:#ffffff0d;font-size:12px}
.pl.on{border-color:var(--rose);background:#ffffff1a}
.pl input{
  background:none;border:none;border-bottom:1px solid #ffffff44;color:inherit;
  font-size:15px;width:100%;padding:2px 0;font-weight:600;outline:none
}
.pl.a input{color:var(--p1)} .pl.b input{color:var(--p2)}
.pl small{display:block;margin-top:4px;opacity:.7}
#stage{display:flex;align-items:center;justify-content:center;gap:22px;min-height:132px}
#dice{
  width:84px;height:84px;border-radius:18px;background:#fff;color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:58px;box-shadow:0 4px 0 #0004
}
#dice.roll{animation:shake .5s}
@keyframes shake{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
#wheelWrap{position:relative;width:132px;height:132px;display:none}
#wheelWrap::after{
  content:"";position:absolute;top:-8px;left:50%;margin-left:-8px;
  border:8px solid transparent;border-top:14px solid var(--rose);z-index:2
}
#wheel{
  width:100%;height:100%;border-radius:50%;position:relative;border:3px solid #fff;
  background:conic-gradient(#5b86d6 0 60deg,#4fae78 60deg 120deg,#e88a4d 120deg 180deg,#8f6fd0 180deg 240deg,#e5a912 240deg 300deg,#e0607e 300deg 360deg);
  transition:transform 2.4s cubic-bezier(.15,.7,.1,1)
}
#wheel i{
  position:absolute;left:50%;top:50%;width:46px;margin-left:-23px;margin-top:-9px;
  font-style:normal;font-size:11px;font-weight:700;text-align:center;color:#fff;line-height:1.1;
  text-shadow:0 1px 2px #0008
}
#go{
  background:var(--rose);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:700;
  padding:14px;cursor:pointer;box-shadow:0 4px 0 #b84660
}
#go:active{transform:translateY(3px);box-shadow:0 1px 0 #b84660}
#go:disabled{opacity:.5;cursor:default}
#log{font-size:12.5px;opacity:.8;line-height:1.6;max-height:92px;overflow:auto}
.tools{display:flex;gap:8px;justify-content:flex-end;font-size:12px}
.tools button{background:#ffffff14;color:inherit;border:none;border-radius:8px;padding:6px 10px;cursor:pointer}
.note{font-size:11px;opacity:.55;margin-top:12px;text-align:center;max-width:520px;line-height:1.6}

/* ---------- 弹窗 ---------- */
#mask{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#modal{background:#fff;color:var(--ink);border-radius:20px;padding:24px 22px 18px;width:min(340px,100%);text-align:center}
#modal h2{font-size:14px;color:var(--rose);margin-bottom:10px;font-weight:600}
#modal p{font-size:22px;font-weight:700;line-height:1.4;margin-bottom:18px;white-space:pre-line}
#modal button{background:var(--ink);color:#fff;border:none;border-radius:12px;padding:11px 28px;font-size:15px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#wheel{transition:none}#dice.roll{animation:none}}

/* 中间一行：靠近终点的两格，文字往外侧靠 */
.cell.nearL{padding-right:28%}
.cell.nearR{padding-left:28%}
/* 斜角格：文字放在可见的三角形里 */
.cell.k-BR{align-items:flex-end;justify-content:flex-end;padding:0 2px 3px 0}
.cell.k-BL{align-items:flex-end;justify-content:flex-start;padding:0 0 3px 2px}
.cell.k-TR{align-items:flex-start;justify-content:flex-end;padding:3px 2px 0 0}
.cell.k-TL{align-items:flex-start;justify-content:flex-start;padding:3px 0 0 2px}
.cell[class*="k-"]{text-align:center;font-size:clamp(6px,calc(var(--s)*.19),10px)}
.cell[class*="k-"] .tx{max-width:56%;word-break:break-all;line-height:1.05}
.cell.k-BR .tx,.cell.k-TR .tx{text-align:right}
.cell.k-BL .tx,.cell.k-TL .tx{text-align:left}
#err{background:#7a1f33;color:#fff;border-radius:10px;padding:10px 14px;margin:10px;font-size:13px;display:none;max-width:560px}

.cell .tx{position:relative;z-index:5;display:block}
.cell.long .tx{font-size:.82em;line-height:1.05;letter-spacing:-.02em}
.cell .pieces{align-items:flex-end;padding-bottom:1px;z-index:3}
.piece{opacity:.92}
.piece svg{width:62%;height:62%;display:block}
#finish{z-index:2}
#finish .lbl{position:relative;z-index:5}
</style>
</head>
<body>

<h1>🐸</h1>
<div id="board"></div>

<div id="panel">
  <div class="players">
    <div class="pl a" id="pl0"><input id="n0" value="男方" maxlength="8" aria-label="男方名字"><small id="st0"></small></div>
    <div class="pl b" id="pl1"><input id="n1" value="女方" maxlength="8" aria-label="女方名字"><small id="st1"></small></div>
  </div>
  <div id="stage">
    <div id="dice">⚀</div>
    <div id="wheelWrap"><div id="wheel"></div></div>
  </div>
  <button id="go">掷骰子</button>
  <div id="log"></div>
  <div class="tools"><button id="rules">规则</button><button id="restart">重新开始</button></div>
</div>
<p class="note">点一下棋盘上的格子可以看完整文字。饮品可以用任何饮料代替，量力而行。格子文案在 config.js 里。</p>

<div id="err"></div>
<div id="mask"><div id="modal"><h2 id="mTitle"></h2><p id="mText"></p><button id="mBtn">好的</button></div></div>

<script src="config.js"></script>
<script>
if(typeof CONFIG==="undefined"){ const e=document.getElementById("err"); e.style.display="block"; e.textContent="没有找到 config.js：请确认 config.js 和 index.html 在同一个文件夹里。"; throw new Error("config.js missing"); }
/* ============ 棋盘路径：13 列 × 13 行，与原图一致 ============ */
/* 坐标 [列, 行]，从 0 开始 */
const RING = [
  [3,0],[4,0],[5,0],[6,0],[7,0],[8,0],[9,0],           // 0-6   上边
  [9,1],[9,2],[9,3],                                    // 7-9
  [10,3],[11,3],[12,3],                                 // 10-12
  [12,4],[12,5],[12,6],[12,7],[12,8],[12,9],            // 13-18 右边
  [11,9],[10,9],[9,9],                                  // 19-21
  [9,10],[9,11],[9,12],                                 // 22-24
  [8,12],[7,12],[6,12],[5,12],[4,12],[3,12],            // 25-30 下边
  [3,11],[3,10],[3,9],                                  // 31-33
  [2,9],[1,9],[0,9],                                    // 34-36
  [0,8],[0,7],[0,6],[0,5],[0,4],[0,3],                  // 37-42 左边
  [1,3],[2,3],[3,3],                                    // 43-45
  [3,2],[3,1]                                           // 46-47
];
const N = RING.length;                 // 48
const START = [0, 24];                 // 男方 / 女方 的入口下标
const STAYP = 39;                      // 进度 39 = 停留格
const LAST = 45;                       // 进度 45 = 终点；40~44 是冲刺通道
const STRETCH_POS = [
  [1,2,3,4,5].map(c=>[c,6]),
  [11,10,9,8,7].map(c=>[c,6])
];
// 斜角格（原图里的切角）
const BL='polygon(0 0,0 100%,100% 100%)', BR='polygon(100% 0,100% 100%,0 100%)',
      TR='polygon(0 0,100% 0,100% 100%)', TL='polygon(0 0,100% 0,0 100%)';
const CORNER = {'3,0':BR,'9,0':BL,'12,3':BL,'0,3':BR,'0,9':TR,'3,12':TR,'9,12':TL,'12,9':TL};
const KNAME = {'3,0':'BR','9,0':'BL','12,3':'BL','0,3':'BR','0,9':'TR','3,12':'TR','9,12':'TL','12,9':'TL'};

/* ============ 状态 ============ */
let pos, cur, skip, busy, over;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const name = i => $('n'+i).value.trim() || (i? '女方':'男方');
const other = i => 1-i;
const ICON = [
  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="14" r="5.2"/><path d="M13.8 10.2L20 4M14.5 4H20v5.5"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5.2"/><path d="M12 14.2V21M8.8 18H15.2"/></svg>'
];

/* ============ 建棋盘 ============ */
const board = $('board');
const cellEls = {};
const key = (c,r)=>c+','+r;
const KIND = {a:'again',b:'back',h:'home',s:'skip',r:'red'};

function makeCell(c,r,data,extra){
  const el = document.createElement('div');
  const type = data[1]||'', color = data[3];
  el.className = 'cell '+(KIND[type]||'')+(color!==undefined?' c'+color:'')+(extra?' '+extra:'');
  el.style.gridArea = (r+1)+'/'+(c+1);
  if(CORNER[key(c,r)]){ el.style.clipPath = CORNER[key(c,r)]; el.classList.add('k-'+KNAME[key(c,r)]); }
  if(extra==='s0' && c===5) el.classList.add('nearL');
  if(extra==='s1' && c===7) el.classList.add('nearR');
  const tx=document.createElement('span'); tx.className='tx'; tx.textContent=data[0]; if(data[0].length>9) el.classList.add('long'); el.appendChild(tx);
  el.title = data[0];
  el.onclick = ()=>{ if(!busy && !over && $('mask').style.display!=='flex') say('格子',data[0]); };
  const pc = document.createElement('div'); pc.className='pieces'; el.appendChild(pc);
  board.appendChild(el);
  cellEls[key(c,r)] = el;
}
function buildBoard(){
  [0,1].forEach(i=>{
    const z=document.createElement('div'); z.className='zone'; z.id='h'+i;
    z.innerHTML='<span></span><div class="pieces"></div>'; board.appendChild(z);
  });
  RING.forEach((p,i)=>makeCell(p[0],p[1],CONFIG.ring[i]));
  CONFIG.stretch.forEach((arr,pi)=>arr.forEach((d,j)=>makeCell(STRETCH_POS[pi][j][0],STRETCH_POS[pi][j][1],d,'s'+pi)));
  const fin=document.createElement('div'); fin.id='finish'; fin.innerHTML='<span class="lbl">终点</span><div class="pieces"></div>'; board.appendChild(fin);
  const t=document.createElement('div'); t.id='title'; t.innerHTML='<strong>情侣飞行棋</strong><span>先到终点者获胜</span>'; board.appendChild(t);
  ['d1','d2'].forEach(id=>{const d=document.createElement('div'); d.id=id; d.className='deco'; d.textContent='♥ ♥ ♥'; board.appendChild(d);});
}

/* ============ 位置换算 ============ */
const ringIdx = (i,p)=> (START[i]+p)%N;
function cellOf(i,p){
  if(p<=STAYP) return RING[ringIdx(i,p)];
  if(p<LAST) return STRETCH_POS[i][p-STAYP-1];
  return null;
}
function dataOf(i,p){
  if(p<=STAYP) return CONFIG.ring[ringIdx(i,p)];
  return CONFIG.stretch[i][p-STAYP-1];
}

/* ============ 渲染 ============ */
function render(){
  document.querySelectorAll('.pieces').forEach(e=>e.innerHTML='');
  document.querySelectorAll('.cell.cur').forEach(e=>e.classList.remove('cur'));
  [0,1].forEach(i=>{
    const pc = document.createElement('div');
    pc.className='piece p'+i; pc.innerHTML=ICON[i];
    let host;
    if(pos[i]<0) host = document.querySelector('#h'+i+' .pieces');
    else if(pos[i]===LAST) host = document.querySelector('#finish .pieces');
    else { const [c,r]=cellOf(i,pos[i]); host = cellEls[key(c,r)].querySelector('.pieces'); }
    host.appendChild(pc);
  });
  if(pos[cur]>=0 && pos[cur]<LAST){ const [c,r]=cellOf(cur,pos[cur]); cellEls[key(c,r)].classList.add('cur'); }
  $('h0').firstChild.textContent = name(0);
  $('h1').firstChild.textContent = name(1);
  [0,1].forEach(i=>{
    $('pl'+i).classList.toggle('on',cur===i);
    $('st'+i).textContent = pos[i]<0 ? '未出发' : pos[i]===LAST ? '到达终点' : '已前进 '+pos[i]+' / '+LAST+' 格' + (skip[i]?' · 休息中':'');
  });
  const notStarted = pos[cur]<0;
  $('wheelWrap').style.display = notStarted ? 'block' : 'none';
  $('dice').style.display = notStarted ? 'none' : 'flex';
  $('go').textContent = over ? '游戏结束' : name(cur)+(notStarted ? '：转转盘' : '：掷骰子');
  $('go').disabled = busy || over;
}
function log(s){ const l=$('log'); l.innerHTML = s+'<br>'+l.innerHTML; }

/* ============ 弹窗 ============ */
function say(title,text,btn='好的'){
  return new Promise(res=>{
    $('mTitle').textContent=title; $('mText').textContent=text; $('mBtn').textContent=btn;
    $('mask').style.display='flex';
    $('mBtn').onclick=()=>{ $('mask').style.display='none'; res(); };
  });
}

/* ============ 骰子 / 转盘 ============ */
const FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];
async function rollDice(){
  const el=$('dice'); el.classList.add('roll');
  for(let i=0;i<8;i++){ el.textContent=FACES[Math.floor(Math.random()*6)]; await sleep(60); }
  const d = 1+Math.floor(Math.random()*6);
  el.textContent = FACES[d-1]; el.classList.remove('roll');
  await sleep(250);
  return d;
}
let wheelRot = 0;
function buildWheel(){
  const w=$('wheel');
  CONFIG.wheel.forEach((s,i)=>{
    const a=(i+.5)*60, e=document.createElement('i');
    e.textContent=(i+1)+' '+s.label;
    e.style.transform='rotate('+a+'deg) translateY(-42px)';
    w.appendChild(e);
  });
}
async function spinWheel(){
  const n = Math.floor(Math.random()*6);
  const a = (n+.5)*60;
  wheelRot += 360*4 + ((360-a) - (wheelRot%360) + 360) % 360;
  $('wheel').style.transform='rotate('+wheelRot+'deg)';
  await sleep(matchMedia('(prefers-reduced-motion:reduce)').matches ? 100 : 2600);
  return CONFIG.wheel[n];
}

/* ============ 移动 ============ */
// 向前走 steps 步：在停留格必须停下（下回合才能进通道）；到终点后多出的步数折返
async function walk(i,steps){
  const from=pos[i]; let p=from, dir=1;
  for(let k=0;k<steps;k++){
    if(p===LAST) dir=-1;
    if(dir>0 && p===STAYP && from<STAYP) break;
    p+=dir; pos[i]=p; render(); await sleep(230);
  }
}
async function stepTo(i,target){
  const dir = target>pos[i]?1:-1;
  while(pos[i]!==target){ pos[i]+=dir; render(); await sleep(200); }
}

/* ============ 格子效果 ============ */
// 返回 true 表示获得再投一次
async function applyCell(me){
  const p=pos[me];
  if(p<=0 || p>=LAST) return false;               // 入口格不触发
  const [txt,type,n,color]=dataOf(me,p);
  const t=type||'';
  if(t===''||t==='r'){ await say(name(me)+' · 互动',txt,'完成'); return false; }
  if(t==='b'){ await say(name(me),txt); await stepTo(me,Math.max(0,p-n)); return false; }
  if(t==='a'){ await say(name(me),'再投一次！'); return true; }
  if(t==='h'){ await say(name(me),'返回起点，重新出发'); pos[me]=-1; return false; }
  if(t==='s'){ await say(name(me),'下一轮休息'); skip[me]=true; return false; }
  if(t==='stay'){
    if(color===me && p===STAYP) await say(name(me),'在此停留，下回合进入终点通道');
    return false;
  }
  if(t==='j'){
    if(color!==me) return false;
    await say(name(me)+' · 飞跃',txt,'完成');
    await say(name(me),'飞跃！前进 '+n+' 格');
    await stepTo(me,Math.min(STAYP,p+n));
    return applyCell(me);
  }
  return false;
}

/* ============ 回合 ============ */
async function nextTurn(){
  cur = other(cur); render();
  if(skip[cur]){
    skip[cur]=false;
    await say('下一轮休息', name(cur)+' 这一轮休息，好好喝口水 ☕');
    return nextTurn();
  }
  busy=false; render();
}

async function act(){
  if(busy||over) return;
  busy=true; render();
  const me=cur, op=other(me);
  let extra=false;

  if(pos[me]<0){
    /* ----- 未出发：转盘 ----- */
    const r = await spinWheel();
    log('<b>'+name(me)+'</b> 转到「'+r.label+'」');
    if(r.act==='sip')   await say(name(me),'喝一口 🥤');
    if(r.act==='again'){ await say(name(me),'再转一次！'); extra=true; }
    if(r.act==='kiss')  await say(name(me),'亲一下对方（脸颊也算）💋');
    if(r.act==='enter'){ pos[me]=0; render(); await say(name(me),'出发！进入棋盘'); }
  } else {
    /* ----- 棋盘：掷骰子 ----- */
    const d = await rollDice();
    log('<b>'+name(me)+'</b> 掷出 '+d);
    await walk(me,d);
    if(pos[me]===LAST) return win(me);
    if(d===6 && CONFIG.sixAgain) extra=true;

    // 追上对方：对方回起点
    if(pos[me]<=STAYP && pos[op]>=0 && pos[op]<=STAYP && ringIdx(me,pos[me])===ringIdx(op,pos[op])){
      pos[op]=-1; render();
      await say('撞上了！', name(me)+' 追上了 '+name(op)+'，对方回到起点');
      log(name(op)+' 被送回起点');
    }
    if(await applyCell(me)) extra=true;
  }

  if(extra && !over){ log(name(me)+' 再来一次'); busy=false; render(); }
  else await nextTurn();
}

async function win(i){
  over=true; render();
  log('🎉 <b>'+name(i)+'</b> 到达终点');
  await say('🎉 '+name(i)+' 获胜',CONFIG.prize,'再来一局');
  start();
}

/* ============ 开始 / 规则 ============ */
function start(){
  pos=[-1,-1]; cur=0; skip=[false,false]; busy=false; over=false;
  $('log').innerHTML='';
  $('dice').textContent='⚀';
  log('新的一局开始，'+name(0)+' 先手。先转转盘，转到「出发」才能进入棋盘。');
  render();
}
$('go').onclick = act;
$('restart').onclick = ()=>{ if(!busy || over) start(); else log('请先完成当前动作'); };
$('rules').onclick = ()=>say('规则',
 '1. 先转转盘，转到「出发」才能上棋盘。\n2. 轮流掷骰子，顺时针前进。\n3. 追上对方的棋子，对方回起点。\n4. 踩到格子就完成上面的内容。\n5. 走到自己的停留格要停一下，下回合才能进终点通道。\n6. 飞跃格：本方颜色的格子，完成任务后前进 12 格。\n7. 先到终点的人获胜，点数过头会折返。');
['n0','n1'].forEach(id=>$(id).addEventListener('input',()=>{ if(pos) render(); }));

buildBoard(); buildWheel(); start();
</script>
</body>
</html>
