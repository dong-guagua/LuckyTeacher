<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>骰子抽签</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--fg:#222;--card:#fff;--line:#ddd;--acc:#d9482b;--mut:#777}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#eee;--card:#222427;--line:#3a3d41;--acc:#ff7a5c;--mut:#999}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
textarea{width:100%;box-sizing:border-box;height:150px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--fg);font:inherit;resize:vertical}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px;font:inherit;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.go{width:100%;background:var(--acc);color:#fff;border:0;font-size:18px;padding:14px}
.mut{color:var(--mut);font-size:14px}
.dice{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.die{width:64px;height:64px;perspective:400px;margin:6px}
.cube{width:64px;height:64px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.cube.blank{opacity:.35}
.face{position:absolute;inset:0;border-radius:10px;background:#fff;border:2px solid #333;box-sizing:border-box;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;backface-visibility:hidden}
.face i{width:11px;height:11px;border-radius:50%;background:#222;place-self:center}
.face.red i{background:#d9482b}
.result{text-align:center;font-size:30px;font-weight:700;color:var(--acc);min-height:44px;word-break:break-all}
.note{text-align:center;font-size:14px;color:var(--mut);min-height:40px}
.pick{display:flex;gap:6px;justify-content:center;margin:6px 0}
.pick button{width:40px;padding:8px 0}
.pick span{width:22px;line-height:40px;color:var(--mut);font-size:13px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>🎲 骰子抽签</h1>
<div class="card">
<div class="mut">选项（每行一个，最多 216 个）</div>
<textarea id="list"></textarea>
<div class="mut" id="info"></div>
</div>
<div class="tabs">
<button id="t1" class="on">自动掷骰</button>
<button id="t2">手动输入点数</button>
</div>
<div class="card">
<div class="dice" id="dice"></div>
<div id="auto"><button class="go" id="roll">掷骰子</button></div>
<div id="manual" class="hide"><div class="mut" style="text-align:center">把 Telegram 里 🎲 的点数按顺序点进来</div><div id="picks"></div></div>
<div class="result" id="res"></div>
<div class="note" id="note"></div>
</div>
<p class="mut">规则：用最少的骰子数 k 组成 N=1..6^k；有效范围取不超过 6^k 的选项数最大整数倍，超出作废重掷；有效时选项=((N−1) mod 选项数)+1。自动模式使用浏览器加密级随机数。</p>
</main>
<script>
const $=id=>document.getElementById(id);
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
let opts=[],k=1,mode='auto',vals=[];
const DEF="玥宝\n小冉\n晚晚\n甜甜圈\n酥鲤鲤\n芋圆\n赛利亚\nLucky\n小泽\n曼曼\n小乖\n香奈儿";
try{$('list').value=localStorage.getItem('dp_list2')||DEF}catch(e){$('list').value=DEF}
const FT={1:'rotateY(0deg)',6:'rotateY(180deg)',2:'rotateY(90deg)',5:'rotateY(-90deg)',3:'rotateX(90deg)',4:'rotateX(-90deg)'};
const FV={1:[0,0],6:[0,180],2:[0,-90],5:[0,90],3:[-90,0],4:[90,0]};
function dieEl(){const d=document.createElement('div');d.className='die';const c=document.createElement('div');c.className='cube';
 for(let f=1;f<=6;f++){const e=document.createElement('div');e.className='face'+(f===1?' red':'');e.style.transform=FT[f]+' translateZ(32px)';
  for(let i=0;i<9;i++){const p=document.createElement('i');p.style.visibility=PIPS[f].includes(i)?'visible':'hidden';e.appendChild(p)}c.appendChild(e)}
 d.appendChild(c);return d}
function showDice(a,spin){const w=$('dice');
 if(w.children.length!==a.length){w.innerHTML='';a.forEach(()=>w.appendChild(dieEl()))}
 a.forEach((v,i)=>{const c=w.children[i].firstChild;c.classList.toggle('blank',!v);
  if(spin){c._s=(c._s||0)+2+i}
  const [fx,fy]=FV[v||1],s=(c._s||0)*360;
  c.style.transform=`rotateX(${s+fx}deg) rotateY(${s+fy}deg)`})}
function rnd6(){const b=new Uint32Array(1);let x;do{crypto.getRandomValues(b);x=b[0]}while(x>=4294967292);return x%6+1}
function parse(){
 opts=$('list').value.split('\n').map(s=>s.trim()).filter(Boolean);
 try{localStorage.setItem('dp_list2',$('list').value)}catch(e){}
 const n=opts.length;
 k=1;while(Math.pow(6,k)<n)k++;
 if(n<2){$('info').textContent='至少需要 2 个选项';k=1}
 else{const tot=Math.pow(6,k),valid=Math.floor(tot/n)*n;
  $('info').textContent=`${n} 个选项 → 用 ${k} 个骰子（共 ${tot} 种），有效 1–${valid}，`+(tot>valid?`${valid+1}–${tot} 作废重掷（${((tot-valid)/tot*100).toFixed(1)}%）`:'无需重掷')}
 vals=[];showDice(Array(k).fill(0),false);buildPicks();$('res').textContent='';$('note').textContent=''}
function buildPicks(){const p=$('picks');p.innerHTML='';
 for(let i=0;i<k;i++){const row=document.createElement('div');row.className='pick';
  const s=document.createElement('span');s.textContent='第'+(i+1);row.appendChild(s);
  for(let v=1;v<=6;v++){const b=document.createElement('button');b.textContent=v;b.className=vals[i]===v?'on':'';
   b.onclick=()=>{vals[i]=v;showDice(Array.from({length:k},(_,j)=>vals[j]||0),false);buildPicks();if(vals.filter(Boolean).length===k)calc(vals.slice())};row.appendChild(b)}
  p.appendChild(row)}}
function calc(d){
 const n=opts.length;if(n<2)return null;
 let N=0;d.forEach(v=>N=N*6+(v-1));N+=1;
 const tot=Math.pow(6,k),valid=Math.floor(tot/n)*n;
 if(N>valid){$('res').textContent='作废';$('note').textContent=`N=${N} 超出有效范围 1–${valid}，请重掷`;return null}
 const o=(N-1)%n+1;
 $('res').textContent=`${o}. ${opts[o-1]}`;
 $('note').textContent=`点数 ${d.join(' , ')} → N=${N} → 选项 ${o}`;return o}
$('roll').onclick=()=>{
 if(opts.length<2)return;
 const btn=$('roll');btn.disabled=true;$('res').textContent='';$('note').textContent='';
 const d=Array.from({length:k},rnd6);showDice(d,true);
 setTimeout(()=>{calc(d);btn.disabled=false},1050)};
$('list').oninput=parse;
function setMode(m){mode=m;$('auto').classList.toggle('hide',m!=='auto');$('manual').classList.toggle('hide',m!=='manual');
 $('t1').className=m==='auto'?'on':'';$('t2').className=m==='manual'?'on':'';vals=[];showDice(Array(k).fill(0),false);buildPicks();$('res').textContent='';$('note').textContent=''}
$('t1').onclick=()=>setMode('auto');$('t2').onclick=()=>setMode('manual');
parse();
</script>
</body>
</html>
